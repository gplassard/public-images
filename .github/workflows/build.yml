name: build
on:
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare Plakar build sources
        id: prepare
        uses: ./.github/actions/prepare-plakar-build
      - name: Build Docker image
        id: build_docker_image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |-
            K8S_VERSION=${{ steps.prepare.outputs.k8s_semver }}
            RCLONE_VERSION=${{ steps.prepare.outputs.rclone_semver }}
