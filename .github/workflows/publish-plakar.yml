name: publish-plakar
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Read tag from file
        id: tag
        run: echo "TAG=$(cat plakar-tag.txt)" >> $GITHUB_OUTPUT
      - name: Extract major version
        id: major
        run: echo "MAJOR=$(echo ${{ steps.tag.outputs.TAG }} | sed -E 's/^(v?[0-9]+).*/\1/')" >> $GITHUB_OUTPUT
      - name: Read K8s version from file
        id: k8s_version
        run: echo "K8S_VERSION=$(cat k8s-version.txt)" >> $GITHUB_OUTPUT
      - name: Read RClone version from file
        id: rclone_version
        run: echo "RCLONE_VERSION=$(cat rclone-version.txt)" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          repository: PlakarKorp/plakar
          ref: ${{ steps.tag.outputs.TAG }}
          path: plakar-src
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          repository: PlakarKorp/integrations
          ref: ${{ steps.k8s_version.outputs.K8S_VERSION }}
          path: integrations-k8s
          sparseCheckout: k8s/k8s
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          repository: PlakarKorp/integrations
          ref: ${{ steps.rclone_version.outputs.RCLONE_VERSION }}
          path: integrations-rclone
          sparseCheckout: rclone/rclone
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |-
            ghcr.io/${{ github.repository }}/plakar:latest,
            ghcr.io/${{ github.repository }}/plakar:${{ steps.major.outputs.MAJOR }},
            ghcr.io/${{ github.repository }}/plakar:${{ steps.tag.outputs.TAG }}-${{ steps.sha.outputs.SHORT_SHA }}
