name: Prepare Plakar Docker build
description: Check out the Plakar source, integrations, and recipes needed by the Dockerfile.
outputs:
  plakar_tag:
    description: Plakar source tag.
    value: ${{ steps.versions.outputs.PLAKAR_TAG }}
  k8s_version:
    description: Kubernetes integration package version.
    value: ${{ steps.versions.outputs.K8S_VERSION }}
  k8s_semver:
    description: Kubernetes integration commit SHA used as its package version.
    value: ${{ steps.versions.outputs.K8S_SEMVER }}
  rclone_version:
    description: Rclone integration ref.
    value: ${{ steps.versions.outputs.RCLONE_VERSION }}
  rclone_semver:
    description: Rclone integration version used by the Dockerfile.
    value: ${{ steps.versions.outputs.RCLONE_SEMVER }}
runs:
  using: composite
  steps:
    - name: Read build versions
      id: versions
      shell: bash
      run: |
        echo "PLAKAR_TAG=$(cat plakar-tag.txt)" >> "$GITHUB_OUTPUT"
        echo "K8S_VERSION=$(cat k8s-version.txt)" >> "$GITHUB_OUTPUT"
        echo "K8S_SEMVER=$(sed -E 's|.*/||' k8s-version.txt)" >> "$GITHUB_OUTPUT"
        echo "RCLONE_VERSION=$(cat rclone-version.txt)" >> "$GITHUB_OUTPUT"
        echo "RCLONE_SEMVER=$(sed -E 's|.*/||' rclone-version.txt)" >> "$GITHUB_OUTPUT"
    - name: Checkout Plakar source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        repository: PlakarKorp/plakar
        ref: ${{ steps.versions.outputs.PLAKAR_TAG }}
        path: plakar-src
    - name: Checkout hub recipes
      shell: bash
      run: git clone --depth 1 https://github.com/PlakarKorp/hub.git hub
    - name: Checkout pinned K8s integration commit
      shell: bash
      run: git init integrations-k8s && cd integrations-k8s && git remote add origin https://github.com/gplassard/plakar-integrations.git && git fetch --depth 1 origin ${{ steps.versions.outputs.K8S_VERSION }} && git checkout --detach FETCH_HEAD && git sparse-checkout init --cone && git sparse-checkout set k8s
    - name: Checkout RClone integration
      shell: bash
      run: git clone --depth 1 --branch ${{ steps.versions.outputs.RCLONE_VERSION }} https://github.com/PlakarKorp/integrations.git integrations-rclone && cd integrations-rclone && git sparse-checkout init --cone && git sparse-checkout set rclone
    - name: Copy recipe files
      shell: bash
      run: cp hub/community/v1.1.0/k8s/recipe.yaml integrations-k8s/k8s/recipe.yaml && cp hub/community/v1.1.0/rclone/recipe.yaml integrations-rclone/rclone/recipe.yaml
